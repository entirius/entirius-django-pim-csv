[project]
name = "entirius-django-pim-csv"
version = "4.1.0"
description = "Bulk CSV import for PIM data: categories, products, attributes, and channel configuration"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "python-slugify",
    "pytz",
    "tqdm",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-lockfile>=2.0.0",
    "entirius-django-pim>=3.3.0",
    "entirius-django-regional>=2.0.0",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-pim-csv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pim_csv"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_pim_csv/csv/*" = ["E722", "S110", "UP031"]
"src/django_pim_csv/management/commands/*" = ["B904", "E722"]
"src/django_pim_csv/worker/**" = ["B007", "B904", "E712", "E722", "E741", "F841", "S108", "S324", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["django_pim_csv"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
